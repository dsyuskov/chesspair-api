name: Deploy to VDS

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/chesspair-api
      CONTAINER_NAME: chesspair-api
      DEPLOY_PATH: /home/deploy/chesspair-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VDS via SSH
        uses: appleboy/ssh-action@v1.0.3          
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            set -e
            
            echo "Changing to deployment directory..."
            cd ${{ env.DEPLOY_PATH }} || { echo "Failed to change directory"; exit 1; }
            
            echo "Pulling latest Docker image..."
            docker pull ${{ env.IMAGE_NAME }}:latest || { echo "Failed to pull Docker image"; exit 1; }
            
            echo "Checking disk space..."
            df -h | grep -E '9[5-9]%|100%' && { echo "Disk space critical"; exit 1; } || true
            
            echo "Stopping old containers..."
            docker compose -f docker-compose.yml down || { echo "Failed to stop containers"; exit 1; }
            
            echo "Starting new containers..."
            docker compose -f docker-compose.yml up -d || { echo "Failed to start containers"; exit 1; }
            
            echo "Verifying deployment..."
            sleep 5
            docker compose -f docker-compose.yml ps | grep -E 'unhealthy|exited' && { echo "Container health check failed"; exit 1; } || true
            
            echo "Deployment successful!"

