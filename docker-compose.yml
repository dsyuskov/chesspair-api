version: '3.8'

services:
  chesspair-api:
    image: ${DOCKER_IMAGE:-dsyuskov/chesspair-api:latest}
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
